<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="100%" height="100%">
  <defs>
    <!-- Smooth gradient fill matching the original image -->
    <linearGradient id="graphGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E4BFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5E4BFF" stop-opacity="0.0"/>
